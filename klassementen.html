<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Klassementen België</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --text:#e6e8ec; --muted:#8b93a3; --accent:#3aa3ff; --accent2:#7adfb0;
    --warn:#ffb86b; --bad:#ff7a90; --hl:rgba(58,163,255,.16);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
  a { color:var(--accent); }

  header {
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:14px 20px;
    background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10;
  }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header h1 .sub { color:var(--muted); font-weight:400; margin-left:8px; font-size:13px; }
  header .grow { flex:1; }
  header select, header input[type=search] {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 11px; font:inherit; min-width:0;
  }
  header label.chk { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; cursor:pointer; }
  header .back { text-decoration:none; font-size:13px; padding:7px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); }
  header .status { font-size:12px; color:var(--muted); width:100%; }

  main { padding:18px 20px 60px; }
  .empty { padding:60px; text-align:center; color:var(--muted); }
  h2.comp { font-size:15px; margin:26px 0 10px; color:var(--muted); font-weight:600; letter-spacing:.3px; text-transform:uppercase; }
  h2.comp:first-child { margin-top:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:12px; }

  .pool { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .pool .ph { display:flex; align-items:baseline; gap:8px; padding:10px 12px 6px; }
  .pool .ph b { font-size:14px; }
  .pool .ph .grp { color:var(--muted); font-size:12px; }
  .pool .ph .grow { flex:1; }
  .badge { font-size:11px; padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .badge.final { color:var(--accent2); border-color:var(--accent2); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:4px 6px; text-align:right; white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:11px; border-bottom:1px solid var(--line); }
  td.team, th.team { text-align:left; white-space:normal; width:100%; }
  td.pts { font-weight:600; }
  tr.ours td { background:var(--hl); }
  tr.ours td.team { font-weight:600; }
  tr.match td.team { color:var(--warn); }
  .pool .pf { padding:6px 12px 9px; color:var(--muted); font-size:11px; border-top:1px solid var(--line); }
  td.pos { color:var(--accent2); } td.neg { color:var(--bad); }

  @media (max-width: 600px) {
    header, main { padding-left:16px; padding-right:16px; }
    .grid { grid-template-columns:1fr; }
    th.hide-sm, td.hide-sm { display:none; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">◀ Velden</a>
  <h1>Klassementen <span class="sub">alle Belgische competities</span></h1>
  <div class="grow"></div>
  <select id="season" title="Seizoen"></select>
  <select id="kind" title="Outdoor / indoor">
    <option value="outdoor">Outdoor</option>
    <option value="indoor">Indoor</option>
    <option value="other">Trimmers / recreatief</option>
  </select>
  <select id="cat" title="Categorie"></select>
  <select id="gender" title="Geslacht">
    <option value="">Jongens + meisjes</option>
    <option value="M">Heren / jongens</option>
    <option value="F">Dames / meisjes</option>
  </select>
  <input id="q" type="search" placeholder="Zoek club…" />
  <label class="chk"><input id="ours" type="checkbox" /> Enkel Olympia</label>
  <span id="status" class="status"></span>
</header>

<main id="main"><div class="empty">Laden…</div></main>

<script>
(function () {
  const OUR_CLUB = 'Olympia';
  const DATA = JSON.parse(document.getElementById('standings-data').textContent);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  // Sort order: top leagues first, then adults by level, then youth from old to young.
  const COMP_ORDER = ['Top Hockey', 'Belgian League', 'Open League', 'Fun League', 'Gentlemen', 'Gentleman',
                      'Ladies', 'Junior Ladies', 'Men', 'Heren', 'Women', 'Dames', '45+', '35+', 'Trimmers'];
  function compRank(p) {
    if (p.age) return 100 + (30 - p.age) * 2 + (p.gender === 'F' ? 1 : 0);
    const i = COMP_ORDER.findIndex(k => p.comp.startsWith(k));
    return (i < 0 ? 50 : i) * 2 + (p.gender === 'F' ? 1 : 0);
  }
  function divRank(d) {
    if (/Honour/.test(d)) return 0;
    const m = d.match(/(Nat|Reg)\.?\s*(\d+)/);
    if (m) return (m[1] === 'Nat' ? 0 : 10) + Number(m[2]);
    return 50;
  }
  const kindOf = p => (p.kind === 'outdoor' || p.kind === 'indoor') ? p.kind : 'other';

  // ----- controls -----
  const seasons = DATA.seasons.slice().sort((a, b) => b.season.localeCompare(a.season));
  $('season').innerHTML = seasons.map(s => `<option>${esc(s.season)}</option>`).join('');
  const CATS = [['', 'Alle categorieën'], ['adult', 'Volwassenen'], ...[19, 16, 14, 12, 11, 10].map(a => ['U' + a, 'U' + a])];
  $('cat').innerHTML = CATS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');

  // Remember the viewer's filters between visits; the page works without it.
  const KEY = 'klassementen.filters';
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    for (const id of ['kind', 'cat', 'gender']) if (saved[id] != null) $(id).value = saved[id];
    if (saved.ours != null) $('ours').checked = saved.ours;
  } catch (e) {}
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ kind: $('kind').value, cat: $('cat').value, gender: $('gender').value, ours: $('ours').checked })); } catch (e) {}
  }

  const teamClub = t => String(t).replace(/\s+\S+$/, '');   // "Waterloo Ducks U19B-4" -> "Waterloo Ducks"
  const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short', year: 'numeric' }) : '?';

  function isFinal(p) {
    const iP = p.cols.indexOf('Played');
    const n = p.rows.length;
    if (iP < 0 || n < 2) return false;
    const played = p.rows.map(r => Number(r[iP]));
    return played.every(x => x === played[0]) && (played[0] === n - 1 || played[0] === 2 * (n - 1));
  }

  function poolCard(p, q) {
    const c = name => p.cols.indexOf(name);
    const iT = c('Team'), iP = c('Played'), iW = c('Won'), iD = c('Draw'), iL = c('Lost'),
          iGF = c('Own Goals'), iGA = c('Against Goals'), iPts = c('Points'), iR = c('Rank');
    const v = (r, i) => i < 0 ? '' : r[i];
    const body = p.rows.map(r => {
      const team = String(v(r, iT));
      const ours = teamClub(team) === OUR_CLUB;
      const match = q && team.toLowerCase().includes(q);
      const gd = (Number(v(r, iGF)) || 0) - (Number(v(r, iGA)) || 0);
      return `<tr class="${ours ? 'ours' : ''}${match ? ' match' : ''}">
        <td>${esc(v(r, iR))}</td><td class="team">${esc(team)}</td>
        <td>${esc(v(r, iP))}</td><td class="hide-sm">${esc(v(r, iW))}</td><td class="hide-sm">${esc(v(r, iD))}</td><td class="hide-sm">${esc(v(r, iL))}</td>
        <td class="hide-sm">${esc(v(r, iGF))}–${esc(v(r, iGA))}</td>
        <td class="${gd > 0 ? 'pos' : gd < 0 ? 'neg' : ''}">${gd > 0 ? '+' : ''}${gd}</td>
        <td class="pts">${esc(v(r, iPts))}</td></tr>`;
    }).join('');
    const title = [p.division, p.group].filter(Boolean).join(' · ');
    return `<div class="pool">
      <div class="ph"><b>${esc(title || p.comp)}</b><span class="grow"></span>
        ${isFinal(p) ? '<span class="badge final">afgerond</span>' : ''}</div>
      <table><thead><tr><th>#</th><th class="team">Team</th><th title="Gespeeld">G</th>
        <th class="hide-sm" title="Gewonnen">W</th><th class="hide-sm" title="Gelijk">GL</th><th class="hide-sm" title="Verloren">V</th>
        <th class="hide-sm" title="Doelpunten voor–tegen">DP</th><th title="Doelsaldo">+/−</th><th title="Punten">Ptn</th></tr></thead>
        <tbody>${body}</tbody></table>
      <div class="pf">Stand van ${fmtDate(p.fetchedAt)} · laatst gecontroleerd ${fmtDate(p.lastChecked)}</div>
    </div>`;
  }

  function render() {
    persist();
    const s = seasons.find(x => x.season === $('season').value);
    if (!s) { $('main').innerHTML = '<div class="empty">Nog geen klassementen bewaard.</div>'; return; }
    const kind = $('kind').value, cat = $('cat').value, g = $('gender').value;
    const q = $('q').value.trim().toLowerCase(), ours = $('ours').checked;

    const pools = s.pools.filter(p => {
      if (kindOf(p) !== kind) return false;
      if (cat === 'adult' && p.age) return false;
      if (cat && cat !== 'adult' && p.comp.split(' ')[0] !== cat) return false;
      if (g && p.gender !== g) return false;
      const teams = p.rows.map(r => String(r[p.cols.indexOf('Team')]));
      if (ours && !teams.some(t => teamClub(t) === OUR_CLUB)) return false;
      if (q && !teams.some(t => t.toLowerCase().includes(q))) return false;
      return true;
    }).sort((a, b) => compRank(a) - compRank(b) || a.comp.localeCompare(b.comp) ||
                      divRank(a.division) - divRank(b.division) || a.group.localeCompare(b.group));

    $('status').textContent = `${pools.length} poules · bijgewerkt ${fmtDate(s.updated)}`;
    if (!pools.length) { $('main').innerHTML = '<div class="empty">Geen poules voor deze selectie.</div>'; return; }

    let html = '', cur = null;
    for (const p of pools) {
      if (p.comp !== cur) {
        if (cur !== null) html += '</div>';
        html += `<h2 class="comp">${esc(p.comp)}</h2><div class="grid">`;
        cur = p.comp;
      }
      html += poolCard(p, q);
    }
    $('main').innerHTML = html + '</div>';
  }

  for (const id of ['season', 'kind', 'cat', 'gender', 'ours']) $(id).addEventListener('change', render);
  $('q').addEventListener('input', render);
  render();
})();
</script>
