name: Refresh schedule data

# The daily cron is OFF, and the data refresh now runs on Bart's machine via the
# "OlympiaCalendar Refresh" scheduled task (refresh-local.ps1).
#
# Reason: hockey.be sits behind Cloudflare, which serves its "Just a moment..."
# JavaScript challenge to GitHub-hosted runners. The first request of a process gets
# through and every one after it returns 403. Verified 2026-08-19 — the same call
# succeeded from a probe step and then 403'd on the script's second call, at 200ms,
# 4s, 15s and 45s spacing alike. It is not a rate limit and there is no polite way
# around a JS challenge, so the job belongs on a non-datacenter connection.
#
# The manual trigger below is kept for the day this repo gets a self-hosted runner on
# a normal connection — point `runs-on` at it and this works again unchanged. Running
# it on `ubuntu-latest` will fail at the second API call.

on:
  workflow_dispatch:

# Allow the workflow's bot to commit the updated index.html back to the repo.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run update.ps1
        shell: pwsh
        run: ./update.ps1

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "chore: refresh schedule data (auto)"
            git push
          fi
