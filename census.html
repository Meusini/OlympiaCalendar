<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Clubs en teams</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --text:#e6e8ec; --muted:#8b93a3; --accent:#3aa3ff; --accent2:#7adfb0; --bad:#ff7a90; --hl:rgba(58,163,255,.16);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:14px 20px;
    background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header h1 .sub { color:var(--muted); font-weight:400; margin-left:8px; font-size:13px; }
  header .grow { flex:1; }
  input, button, select { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 11px; font:inherit; min-width:0; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  main { padding:18px 20px 60px; max-width:1600px; }
  .lock { max-width:360px; margin:12vh auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; }
  .lock h2 { margin:0 0 12px; font-size:16px; }
  .lock form { display:flex; gap:8px; } .lock input { flex:1; }
  .lock .err { color:var(--bad); font-size:13px; margin-top:10px; min-height:18px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-bottom:18px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .kpi .v { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi .l { color:var(--muted); font-size:12px; }
  h2.sec { font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; margin:26px 0 10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:6px 8px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:12px; position:sticky; top:0; background:var(--panel); cursor:pointer; user-select:none; }
  th.l, td.l { text-align:left; }
  tbody tr:hover td { background:var(--hl); }
  tr.club { cursor:pointer; }
  tr.detail td { background:var(--panel2); text-align:left; white-space:normal; }
  .mxwrap { display:flex; flex-wrap:wrap; gap:14px 28px; padding:6px 0 4px; }
  .mxh { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; margin-bottom:4px; }
  table.mx { width:auto; }
  table.mx th, table.mx td { text-align:center; padding:3px 9px; background:transparent; }
  table.mx th { position:static; cursor:default; }
  table.mx th.l, table.mx td.l { text-align:left; }
  table.mx tbody tr:hover td { background:var(--hl); }
  td.total { font-weight:600; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  .filterbar { display:flex; flex-wrap:wrap; gap:6px; padding:14px 20px 0; } .filterbar[hidden] { display:none; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; }
  td.rk { color:var(--muted); } th.rk { cursor:default; }
  tr.tot td { border-top:2px solid var(--line); font-weight:600; }
  .flowbar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:flex-start; margin-bottom:14px; }
  #fsel { position:relative; }
  #fsel summary { cursor:pointer; list-style:none; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:7px 11px; }
  #fsel summary::after { content:" ▾"; color:var(--muted); }
  .fsel-body { position:absolute; z-index:20; margin-top:4px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; width:min(520px, 90vw); box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .fsel-btns { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; align-items:center; }
  .fsel-types { display:flex; flex-wrap:wrap; gap:4px 12px; margin-left:8px; font-size:12px; color:var(--muted); }
  .fsel-types label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  .ty { display:inline-block; font-size:11px; padding:0 6px; border-radius:999px; border:1px solid var(--line); line-height:16px; }
  .ty-hoog { color:#7adfb0; border-color:#7adfb0; } .ty-middel { color:#3aa3ff; border-color:#3aa3ff; }
  .ty-laag { color:#8b93a3; } .ty-geen { color:#5a6272; border-color:transparent; }
  .typeline { color:var(--muted); font-size:12px; margin:2px 0 6px; }
  #ledent tr.sub td { font-weight:600; color:var(--muted); border-bottom:2px solid var(--line); }
  #ledent tr.tot td { font-weight:700; border-top:2px solid var(--line); border-bottom:2px solid var(--line); background:var(--panel2); }
  #ledent tr.new td.l { color:#ffb86b; }
  #ledent td.pos { color:var(--accent2); } #ledent td.neg { color:var(--bad); }
  #ledent th { cursor:default; white-space:normal; }
  /* Column groups in the club table: tinted headers, a line where each group starts. */
  #clubs tr.ghead th { position:static; cursor:default; text-align:center; font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--text); border-bottom:none; padding-top:8px; }
  #clubs th.grp-comp { background:rgba(122,223,176,.10); } #clubs tr.ghead th.grp-comp { color:#7adfb0; }
  #clubs th.grp-teams { background:rgba(58,163,255,.10); } #clubs tr.ghead th.grp-teams { color:#3aa3ff; }
  #clubs th.grp-spel { background:rgba(255,184,107,.10); } #clubs tr.ghead th.grp-spel { color:#ffb86b; }
  #clubs td.grp-comp { background:rgba(122,223,176,.03); } #clubs td.grp-teams { background:rgba(58,163,255,.03); } #clubs td.grp-spel { background:rgba(255,184,107,.03); }
  #clubs th.grp-nc { background:rgba(169,136,255,.12); } #clubs tr.ghead th.grp-nc { color:#a988ff; } #clubs td.grp-nc { background:rgba(169,136,255,.04); }
  #clubs .gstart { border-left:2px solid var(--line); }
  #fsel-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:2px 10px; max-height:50vh; overflow:auto; font-size:13px; }
  #fsel-list label { display:flex; gap:6px; align-items:center; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .flowlegend { display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--muted); font-size:12px; align-items:center; padding-top:8px; }
  .flowlegend i { display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .charts { display:grid; grid-template-columns:1fr; gap:18px; max-width:1100px; }
  .projt td, .projt th { text-align:right; }
  .projt .gs { border-left:2px solid var(--line); }
  .projt th.ncc, .projt td.ncc { background:rgba(169,136,255,.08); }
  .projt tr.now td { color:var(--accent); font-weight:600; }
  .chart { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
  .chart h2.sec { margin:0 0 6px; }
  .chart svg text { font-family:inherit; }
  .hov { min-height:18px; font-size:12px; color:var(--muted); }
  @media (max-width: 600px) { .charts { grid-template-columns:1fr; } }
  .filters select.on { border-color:var(--accent); color:var(--accent); }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; background:var(--panel2); border-radius:10px; padding:3px; border:1px solid var(--line); }
  .tabs button { background:transparent; border:none; padding:6px 12px; border-radius:7px; color:var(--muted); }
  .tabs button.active { background:var(--accent); color:#0b1320; font-weight:600; }
  .navs { display:flex; flex-wrap:wrap; gap:8px 18px; } .navs[hidden] { display:none; }
  .navgroup { display:flex; align-items:center; gap:8px; }
  .navlabel { color:var(--muted); font-size:11px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; white-space:nowrap; }
  #map { height:calc(100vh - 170px); min-height:420px; border-radius:10px; border:1px solid var(--line); background:var(--panel); }
  main:has(#v-map:not([hidden])) { max-width:none; }
  #map .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  .leaflet-popup-content { margin:12px 14px; font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .pop b { font-size:15px; } .pop .t { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .pop table { width:auto; } .pop td { border:none; padding:2px 10px 2px 0; } .pop td.l { color:var(--muted); }
  .pop .big { font-size:20px; font-weight:700; }
  .sizes { background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:11px; }
  .sizes svg { display:block; }
  #v-sterkte { max-width:1100px; }
  #v-sterkte th { position:static; cursor:default; }
  #v-sterkte td.pos { color:var(--accent2); } #v-sterkte td.neg { color:var(--bad); }
  .stbar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  #st-main { margin-top:14px; }
  th.st-team, td.st-team { text-align:left; white-space:normal; width:100%; }
  td.st-nr { color:var(--muted); }
  tr.st-ours td { background:var(--hl); } tr.st-ours td.st-team { font-weight:600; }
  .band { display:inline-block; min-width:68px; text-align:center; padding:2px 8px; border-radius:6px; font-size:12px; }
  table.st-mx th, table.st-mx td { text-align:center; }
  table.st-mx th.row, table.st-mx td.row { text-align:left; color:var(--muted); width:1%; }
  table.st-mx td { vertical-align:top; min-width:84px; }
  table.st-mx .sub { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  table.st-mx .none { color:var(--line); }
  .clubblock { padding:14px 16px 16px; border:1px solid var(--line); border-radius:12px; }
  .clubblock.ours { border-color:var(--accent); background:rgba(58,163,255,.06); }
  .clubhead { display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:18px; font-weight:600; }
  .clubhead img { height:30px; }
  .clubhead + h2.sec { margin-top:0; }
  .clubover { display:inline-flex; align-items:center; gap:6px; margin-left:6px; color:var(--muted); font-size:12px; font-weight:400; }
  table.st-mx th.st-first, table.st-mx td.st-first { border-left:2px solid var(--line); vertical-align:middle; width:1%; }
  #v-clubstr { max-width:1100px; }
  #clubstr tr.ghead th { position:static; cursor:default; text-align:center; font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--text); border-bottom:none; padding-top:8px; }
  #clubstr th.grp-comp { background:rgba(122,223,176,.10); } #clubstr tr.ghead th.grp-comp { color:#7adfb0; } #clubstr td.grp-comp { background:rgba(122,223,176,.03); }
  #clubstr th.grp-sterkte { background:rgba(255,122,144,.10); } #clubstr tr.ghead th.grp-sterkte { color:#ff7a90; } #clubstr td.grp-sterkte { background:rgba(255,122,144,.03); }
  #clubstr .gstart { border-left:2px solid var(--line); }
  #clubstr tr.st-ours td { background:var(--hl); font-weight:600; }
  #st-evo tr.st-group td { font-weight:600; color:var(--text); background:var(--panel2); text-align:left; }
  #st-evo th.l, #st-evo td.l { text-align:left; width:1%; min-width:0; }
  #scwrap, #fcwrap { position:relative; }
  #sc, #fc { display:block; touch-action:pan-y; }
  #sc text, #fc text { fill:var(--muted); font-size:11px; } #sc text.sc-label, #fc text.sc-label { fill:var(--text); font-size:12px; font-weight:600; }
  #ov-fields, #ov-fees { max-width:1100px; } #fc-table th, #fee-cats th, #fee-clubs th { position:static; } #fc-table th, #fee-cats th { cursor:default; }
  #fee-clubs tr.st-ours td, #fee-cats tr.st-ours td { background:var(--hl); font-weight:600; }
  .sc-tip { position:absolute; z-index:5; pointer-events:none; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; white-space:nowrap; }
  .sc-tip[hidden] { display:none; }
  .help { width:18px; height:18px; padding:0; margin-left:6px; border-radius:50%; font-size:11px; line-height:16px; text-align:center; color:var(--text); vertical-align:middle; }
  #helpdlg { padding:0; width:min(520px, calc(100vw - 32px)); background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; }
  #helpdlg::backdrop { background:rgba(0,0,0,.6); }
  .helpbody { position:relative; padding:18px 20px 20px; }
  .helpbody h3 { margin:0 32px 10px 0; font-size:16px; }
  .helpbody ul { margin:0; padding-left:18px; } .helpbody li { margin:6px 0; }
  #helpx { position:absolute; top:10px; right:10px; width:28px; height:28px; padding:0; }
  .pick { display:flex; align-items:center; gap:10px; margin:22px 0 14px; color:var(--muted); }
  .method { margin-top:28px; color:var(--muted); font-size:13px; max-width:820px; }
  .method h3 { color:var(--text); font-size:14px; margin:16px 0 4px; }
  .method ol, .method ul { margin:4px 0; padding-left:20px; }
  .method p { margin:4px 0; }
  @media (max-width: 600px) { header, main, .filterbar { padding-left:16px; padding-right:16px; } header { position:static; } #v-sterkte .hide-sm { display:none; } }
</style>
</head>

<script>
(function () {
  const BOX = JSON.parse(document.getElementById('census-box').textContent);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const fmt = n => n.toLocaleString('nl-BE');

  async function decrypt(pw) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(BOX.salt), iterations: BOX.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(BOX.iv) }, key, unb64(BOX.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  $('unlock').addEventListener('submit', async e => {
    e.preventDefault();
    $('err').textContent = 'Bezig…';
    let data;
    try { data = await decrypt($('pw').value); }
    catch (err) { $('err').textContent = 'Fout wachtwoord.'; return; }
    render(data);   // outside the try: a page bug must not look like a wrong password
  });

  // Age bands follow the match formats: 3v3, 6v6, 8v8, 11v11.
  const BANDS = [['U7–U8', a => a >= 7 && a <= 8], ['U9', a => a === 9], ['U10–U12', a => a >= 10 && a <= 12],
                 ['U14–U19', a => a >= 13], ['Volw.', a => !a]];
  const level = t => /Top Hockey/.test(t.comp) ? 'Top' : /^Nat/.test(t.division) ? 'Nationaal' : /^Reg/.test(t.division) ? 'Regionaal' : 'Overig';

  // Club detail: team counts per sub-level. An adult level only means something inside one
  // competition (Reg. 2 Open League is not Reg. 2 Fun League), so adults get a row per
  // competition; youth get a row per age and gender.
  const SUB = [['Top', 'Top'], ['Nat. Honour', 'Hon.'], ['Nat. 1', 'N1'], ['Nat. 2', 'N2'], ['Nat. 3', 'N3'], ['Nat. 4', 'N4'],
               ['Reg. 1', 'R1'], ['Reg. 2', 'R2'], ['Reg. 3', 'R3'], ['Reg. 4', 'R4'], ['Overig', 'Overig']];
  const subOf = t => /Top Hockey/.test(t.comp) ? 'Top' : SUB.some(([k]) => k === t.division) ? t.division : 'Overig';
  const COMP_ORDER = ['Top Hockey', 'Belgian League', 'Open League Men', 'Open League Women', 'Fun League Men', 'Fun League Women',
                      'Open League Gentlemen', 'Fun League Gentlemen', 'Ladies', 'Junior Ladies', '45+', '35+', 'Trimmers', 'R2C'];
  const compOrder = comp => { const i = COMP_ORDER.findIndex(k => comp.startsWith(k)); return i < 0 ? 99 : i; };
  const YOUTH_G = { M: 'jongens', F: 'meisjes', '': 'gemengd' };

  function matrix(title, rows, fmt1) {
    if (!rows.length) return '';
    const sum = (ts, f) => ts.reduce((s, t) => s + f(t), 0);
    const used = SUB.filter(([k]) => rows.some(r => r.teams.some(t => subOf(t) === k)));
    const cell = (ts, k) => { const n = sum(ts.filter(t => subOf(t) === k), t => t.share); return n ? fmt1(n) : ''; };
    return '<div><div class="mxh">' + title + '</div><table class="mx"><thead><tr><th class="l"></th>' +
      used.map(([k, s]) => '<th title="' + k + '">' + s + '</th>').join('') + '<th>Teams</th><th>Spelers</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td class="l">' + esc(r.label) + '</td>' + used.map(([k]) => '<td>' + cell(r.teams, k) + '</td>').join('') +
        '<td class="total">' + fmt1(sum(r.teams, t => t.share)) + '</td><td>' + fmt1(Math.round(sum(r.teams, t => t.size))) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  function clubDetail(c, fmt1) {
    const youth = c.teams.filter(t => t.age), adult = c.teams.filter(t => !t.age);
    const yRows = [], aRows = [];
    for (const age of [...new Set(youth.map(t => t.age))].sort((a, b) => a - b))
      for (const g of ['M', 'F', '']) {
        const ts = youth.filter(t => t.age === age && (t.gender || '') === g);
        if (ts.length) yRows.push({ label: 'U' + age + ' ' + YOUTH_G[g], teams: ts });
      }
    const byComp = new Map();
    for (const t of adult) { if (!byComp.has(t.comp)) byComp.set(t.comp, []); byComp.get(t.comp).push(t); }
    for (const [comp, ts] of [...byComp].sort((a, b) => compOrder(a[0]) - compOrder(b[0]) || a[0].localeCompare(b[0])))
      aRows.push({ label: comp, teams: ts });
    return '<div class="mxwrap">' + matrix('Jeugd', yRows, fmt1) + matrix('Volwassenen', aRows, fmt1) + '</div>';
  }

  // Team strength: every U10-U19 team against its peers of the same age and gender. Level first; within a
  // level dominance (Bart, 2026-10-31): goal difference per game, in pool spreads above the pool average.
  const ST_AGES = [10, 11, 12, 14, 16, 19];
  // Bart, 2026-10-30: the last team of a level is weaker than the best team of the level below.
  // 0.25 lets the bottom 20% of a level mix with the top 20% of the next one; 0 gives strict tiers.
  const ST_OVERLAP = 0.25;

  function rankTeams(S) {
    const LEVELS = ['Nat. 1', 'Nat. 2', 'Nat. 3', 'Reg. 1', 'Reg. 2', 'Reg. 3'];
    // Combined teams count for both clubs.
    const COMBINED = { 'LALO / ASCA': ['La Louvière', 'Ascalon'] };

    const teams = [];
    for (const p of S.pools) {
      const pool = p.rows.map(([rank, team, played, gf, ga, pts]) => {
        const m = String(team).match(/^(.*\S)\s+U\d+[BG]-(\d+)$/);
        const club = m ? m[1] : String(team);
        return { age: p.age, gender: p.gender, division: p.division, group: p.group, poolSize: p.rows.length,
          team, rank, played, gf, gd: gf - ga, perGame: played ? (gf - ga) / played : 0, ppg: played ? pts / played : 0,
          clubs: COMBINED[club] || [club], nr: m ? Number(m[2]) : 1 };
      });
      const mean = pool.reduce((s, t) => s + t.perGame, 0) / pool.length;
      const spread = Math.sqrt(pool.reduce((s, t) => s + (t.perGame - mean) ** 2, 0) / Math.max(1, pool.length - 1));
      pool.forEach(t => { t.dominance = spread ? (t.perGame - mean) / spread : 0; });
      teams.push(...pool);
    }

    function rankGroup(list) {
      const levels = LEVELS.filter(l => list.some(t => t.division === l));
      levels.forEach((level, i) => {
        const inLevel = list.filter(t => t.division === level)
          .sort((a, b) => b.dominance - a.dominance || b.perGame - a.perGame || b.ppg - a.ppg || b.gf - a.gf);
        inLevel.forEach((t, j) => {
          const place = inLevel.length > 1 ? 1 - j / (inLevel.length - 1) : 0.5;   // 1 = top of the level, 0 = bottom
          t.score = -i + (place - 0.5) * (1 + ST_OVERLAP);
        });
      });
      list.sort((a, b) => b.score - a.score);
      list.forEach((t, i) => {
        t.pos = i + 1;
        t.of = list.length;
        t.pct = 100 * (1 - i / list.length);
        t.percentile = Math.round(t.pct);
        t.band = Math.ceil(10 * t.pos / t.of) * 10;
      });
      return list;
    }
    const GROUPS = {};
    for (const age of ST_AGES) for (const gender of ['M', 'F']) {
      GROUPS[age + gender] = rankGroup(teams.filter(t => t.age === age && t.gender === gender));
    }
    return { teams, GROUPS };
  }

  // Club strength, first team (Bart, 2026-10-31). A club's first team in an age is its strongest team there.
  // Its percentile counts among the first teams of that age and gender only, so 50 is an average first team.
  // Score = average over the six ages, per gender; an age without a team counts 0. Boys + girls is the average
  // of both, only for clubs with both. Returns club -> { M, F, A }, each { score, rank, of } or null.
  function firstTeamMetric(teams, GROUPS) {
    const best = new Map();
    for (const key in GROUPS) {
      const seen = new Set(), firsts = [];
      for (const t of GROUPS[key]) {   // strongest first
        const fresh = t.clubs.filter(c => !seen.has(c));
        if (!fresh.length) continue;
        fresh.forEach(c => { seen.add(c); best.set(c + '|' + key, t); });
        firsts.push(t);
      }
      firsts.forEach((t, i) => { t.pctFirst = 100 * (1 - i / firsts.length); });
    }
    const score = (club, gender, base) => {
      if (!teams.some(t => t.gender === gender && t.clubs.includes(club))) return null;
      return ST_AGES.reduce((s, age) => { const t = best.get(club + '|' + age + gender); return s + (t ? (base === 'first' ? t.pctFirst : t.pct) : 0); }, 0) / ST_AGES.length;
    };
    const clubs = [...new Set(teams.flatMap(t => t.clubs))];
    const build = base => {
      const map = new Map(clubs.map(club => {
        const M = score(club, 'M', base), F = score(club, 'F', base);
        return [club, { M: M === null ? null : { score: M }, F: F === null ? null : { score: F }, A: M === null || F === null ? null : { score: (M + F) / 2 } }];
      }));
      for (const k of ['M', 'F', 'A']) {
        const list = [...map.values()].map(m => m[k]).filter(Boolean).sort((a, b) => b.score - a.score);
        list.forEach((x, i) => { x.rank = i + 1; x.of = list.length; });
      }
      return map;
    };
    const maps = { first: build('first'), all: build('all') };   // against first teams, or against all teams
    return (club, base = 'first') => maps[base].get(club) || null;
  }

  const short = d => d.replace('Nat. ', 'N').replace('Reg. ', 'R');
  const signed = n => (n > 0 ? '+' : '') + n;
  function bandChip(band) {
    const strong = Math.abs(band - 55) / 45;     // 1 at both ends, 0 in the middle
    const rgb = band <= 50 ? '122,223,176' : '255,122,144';
    return '<span class="band" style="background:rgba(' + rgb + ',' + (0.06 + strong * 0.34).toFixed(2) + ')">Top ' + band + '%</span>';
  }

  // Team Strength, Clubs: Olympia on top, a club of choice below, every team per age and gender.
  // Returns a function that draws into an element.
  function clubCompare(teams, firstTeam) {
    const OUR_CLUB = 'Olympia', AGES = ST_AGES;
    const clubBand = x => Math.ceil(10 * x.rank / x.of) * 10;   // the club's place among all clubs in that group
    function clubTable(club, gender) {
      const own = teams.filter(t => t.gender === gender && t.clubs.includes(club));
      const maxNr = Math.max(0, ...own.map(t => t.nr));
      if (!maxNr) return '<div class="note">Geen teams.</div>';
      const first = (firstTeam(club) || {})[gender];
      const firstCell = '<td class="st-first" rowspan="' + maxNr + '">' + (first ? bandChip(clubBand(first)) : '') + '</td>';
      let rows = '';
      for (let nr = 1; nr <= maxNr; nr++) {
        const cells = AGES.map(age => {
          const t = own.find(x => x.age === age && x.nr === nr);
          if (!t) return '<td><span class="none">–</span></td>';
          const tip = t.team + ': ' + t.pos + ' van ' + t.of + ', doelsaldo ' + signed(t.gd) + ' in ' + t.played + ' matchen';
          return '<td title="' + esc(tip) + '">' + bandChip(t.band) + '<span class="sub">' + esc(short(t.division)) + ' · ' + t.rank + '/' + t.poolSize + '</span></td>';
        }).join('');
        rows += '<tr><td class="row">Team ' + nr + '</td>' + cells + (nr === 1 ? firstCell : '') + '</tr>';
      }
      return '<div class="card"><table class="st-mx"><thead><tr><th class="row"></th>' + AGES.map(a => '<th>U' + a + '</th>').join('') +
        '<th class="st-first" title="Sterkte eerste team van deze club tegenover alle clubs">Eerste team</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }
    function clubBlock(club) {
      const ours = club === OUR_CLUB, overall = (firstTeam(club) || {}).A;
      return '<section class="clubblock' + (ours ? ' ours' : '') + '"><div class="clubhead">' + (ours ? '<img src="olympia-logo.png" alt="" />' : '') + esc(club) +
        (overall ? '<span class="clubover" title="Sterkte eerste team, jongens + meisjes, tegenover alle clubs">Overall ' + bandChip(clubBand(overall)) + '</span>' : '') + '</div>' +
        '<h2 class="sec">Jongens</h2>' + clubTable(club, 'M') + '<h2 class="sec">Meisjes</h2>' + clubTable(club, 'F') + '</section>';
    }
    const clubs = [...new Set(teams.flatMap(t => t.clubs))].sort((a, b) => a.localeCompare(b));
    let otherClub = 'Victory';
    return el => {
      const options = clubs.filter(c => c !== OUR_CLUB)
        .map(c => '<option' + (c === otherClub ? ' selected' : '') + '>' + esc(c) + '</option>').join('');
      el.innerHTML = clubBlock(OUR_CLUB) +
        '<label class="pick">Vergelijk met <select id="st-club">' + options + '</select></label><div id="st-other">' + clubBlock(otherClub) + '</div>';
      $('st-club').addEventListener('change', e => { otherClub = e.target.value; $('st-other').innerHTML = clubBlock(otherClub); });
    };
  }

  // Team Strength tab: fills #v-sterkte once and returns its draw function.
  function strengthView(S, teams, GROUPS, drawCompare, evolution) {
    const OUR_CLUB = 'Olympia';
    const AGES = ST_AGES, OVERLAP = ST_OVERLAP;
    const signed1 = n => (n > 0 ? '+' : '') + n.toFixed(1);
    const signClass = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';

    function renderTeams() {
      const list = GROUPS[$('st-age').value + $('st-gender').value];
      const q = $('st-q').value.trim().toLowerCase();
      const shown = q ? list.filter(t => String(t.team).toLowerCase().includes(q)) : list;
      const rows = shown.map(t => '<tr class="' + (t.clubs.includes(OUR_CLUB) ? 'st-ours' : '') + '">' +
        '<td class="st-nr">' + t.pos + '</td>' +
        '<td class="st-team">' + esc(t.team) + '</td>' +
        '<td class="l">' + esc(short(t.division)) + '<span class="hide-sm"> · ' + esc(t.group) + '</span></td>' +
        '<td>' + t.rank + '/' + t.poolSize + '</td>' +
        '<td class="hide-sm">' + t.played + '</td>' +

      $('st-main').innerHTML = shown.length ? '<div class="card"><table><thead><tr>' +

        '<th class="hide-sm" title="Doelsaldo per match, in spreidingen boven het gemiddelde van de eigen poule">Dominantie</th>' +
        '<th class="hide-sm">Percentiel</th><th>Groep</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="note">Geen teams gevonden.</div>';

    // Olympia per team label and round. The label stays, the players move up: U14 team 1 is another age group next season.
    function renderEvolution() {
      const NAMES = ['', 'Eerste teams', 'Tweede teams', 'Derde teams', 'Vierde teams', 'Vijfde teams'];
      const G = { M: 'Jongens', F: 'Meisjes' };

      let body = '';

        body += '<tr class="st-group"><td colspan="' + (3 + evolution.rounds.length) + '">' + esc(NAMES[nr] || 'Team ' + nr) + '</td></tr>';
        for (const t of evolution.teams.filter(x => x.nr === nr)) {
          body += '<tr><td class="l">U' + t.age + '</td><td class="l">' + G[t.gender] + '</td><td class="l">' + t.nr + '</td>' + evolution.rounds.map(([r]) => {
            const x = t.rounds[r];
            if (!x) return '<td><span class="none">–</span></td>';
            const tip = 'Plaats ' + x.pos + ' van ' + x.of + ', doelsaldo ' + signed(x.gd) + ' in ' + x.played + ' matchen';
            return '<td title="' + esc(tip) + '">' + bandChip(x.band) + '<span class="sub">' + esc(short(x.division)) + ' · ' + x.rank + '/' + x.poolSize + '</span></td>';
          }).join('') + '</tr>';
        }
      }
      $('st-main').innerHTML = '<div class="card"><table class="st-mx" id="st-evo"><thead><tr><th class="l">Leeftijd</th><th class="l">Geslacht</th><th class="l">Team</th>' + heads + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        '<div class="note">Groep = plaats tegenover alle teams van die leeftijd en dat geslacht in die ronde, met dezelfde methode als Teams. Een rij volgt het teamlabel, niet de spelers: U14 team 1 in 2026-27 is een andere lichting dan U14 team 1 in 2025-26. Regionale reeksen heetten vorig seizoen VHL, LFH of HV, en tellen als Reg. 1 tot 3.</div>';
    }

    let view = 'teams';
    function draw() {
      const teamsView = view === 'teams';
      $('st-filters').style.display = teamsView ? '' : 'none';
      for (const b of $('st-tabs').querySelectorAll('button')) b.classList.toggle('active', b.dataset.s === view);
      if (teamsView) renderTeams(); else if (view === 'evo') renderEvolution(); else drawCompare($('st-main'));
    }

    const played = teams.map(t => t.played);
    const asOf = S.pools.map(p => p.fetchedAt).sort().pop();
    const factor = (1 + OVERLAP).toLocaleString('nl-BE'), share = Math.round(100 * OVERLAP / (1 + OVERLAP));
    $('v-sterkte').innerHTML =
      '<div class="stbar"><div class="tabs" id="st-tabs"><button data-s="teams" class="active">Teams</button><button data-s="club">Clubs</button><button data-s="evo">Olympia evolutie</button></div>' +
      '<div class="stbar" id="st-filters"><select id="st-age" title="Leeftijd">' + AGES.map(a => '<option value="' + a + '">U' + a + '</option>').join('') + '</select>' +
      '<select id="st-gender" title="Geslacht"><option value="M">Jongens</option><option value="F">Meisjes</option></select>' +
      '<input id="st-q" type="search" placeholder="Zoek club…" /></div></div>' +
      '<div class="note">Stand ' + (asOf ? new Date(asOf).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short', year: 'numeric' }) : '?') + ', ' + Math.min(...played) + ' tot ' + Math.max(...played) + ' matchen gespeeld. De methode staat onderaan.</div>' +
      '<div id="st-main"></div>' +
      '<section class="method"><h2 class="sec">Methode</h2>' +
      '<h3>Dominantie</h3><p>Dominantie meet hoe sterk een team boven zijn eigen poule uitsteekt.</p><ol>' +
      '<li>Doelsaldo per match = doelsaldo ÷ gespeelde matchen.</li>' +
      '<li>Trek daar het gemiddelde van de poule van af.</li>' +
      '<li>Deel door de spreiding van de poule: de standaardafwijking van het doelsaldo per match over alle teams van de poule.</li></ol>' +
      '<p>Voorbeeld: +5,0 per match in een poule met gemiddelde 0 en spreiding 3,0 geeft dominantie +1,7. Dezelfde +5,0 bij spreiding 4,0 geeft +1,3.</p>' +
      '<h3>Ranking</h3><ol>' +
      '<li>Per leeftijd en geslacht krijgt het hoogste niveau nummer 0, het volgende nummer 1, enzovoort. U10–U12 starten bij R1, want daar is geen nationaal niveau.</li>' +
      '<li>Binnen een niveau staan alle teams over alle poules op dominantie. Hun plaats loopt gelijkmatig van 1 (beste team) tot 0 (laatste team).</li>' +
      '<li>Score = (plaats − 0,5) × ' + factor + ' − niveaunummer.</li>' +
      '<li>Alle teams van die leeftijd en dat geslacht komen op score in één lijst.</li></ol>' +
      '<h3>Zakkende en stijgende teams</h3><p>Zonder de factor ' + factor + ' zou elk niveau volledig boven het volgende staan. Met die factor overlappen twee opeenvolgende niveaus.</p><ul>' +
      '<li>Zakkende teams: de onderste ' + share + '% van een niveau op dominantie.</li>' +
      '<li>Stijgende teams: de bovenste ' + share + '% van het niveau eronder.</li>' +
      '<li>Beide groepen vallen in dezelfde scorezone en staan door elkaar op score. Het beste zakkende team staat naast het beste stijgende team, het laatste team van een niveau naast het zwakste stijgende team.</li>' +
      '<li>Daardoor staat het laatste team van een niveau altijd onder het beste team van het niveau eronder.</li>' +
      '<li>Zakkend en stijgend slaan op de plaats in deze ranking, niet op echte promotie of degradatie. De ' + share + '% is een aanname, geen berekende waarde.</li></ul>' +
      '<h3>Percentiel en groep</h3><ul>' +
      '<li>Percentiel = 100 × (1 − (positie − 1) ÷ aantal teams), tegenover alle teams van die leeftijd en dat geslacht.</li>' +
      '<li>Groep = positie ÷ aantal teams, naar boven afgerond op 10%.</li></ul>' +
      '<h3>Sterkte eerste team</h3><ul>' +
      '<li>Eerste team = het sterkste team van een club in die leeftijd. Meestal is dat Team 1.</li>' +
      '<li>Per leeftijd en geslacht krijgt elk eerste team een percentiel tegenover de eerste teams van de andere clubs: 100 is het beste, 50 een gemiddeld eerste team.</li>' +
      '<li>Sterkte per geslacht = gemiddelde over U10, U11, U12, U14, U16 en U19. Een leeftijd zonder team telt als 0. Zo scoort een club met gaten niet hoger dan een volledige club.</li>' +
      '<li>Jongens + meisjes = gemiddelde van beide, enkel voor clubs met jongens én meisjes.</li>' +
      '<li>In Club Strength kan je dezelfde sterkte ook tegenover alle teams bekijken.</li>' +
      '<li>In Clubs staat deze sterkte als groep: plaats van de club ÷ aantal clubs, naar boven afgerond op 10%. Overall is jongens + meisjes.</li>' +
      '<li>Percentielen gelden binnen het eigen geslacht: een hogere score bij meisjes betekent een betere relatieve plaats, niet beter hockey dan de jongens.</li></ul></section>';
    $('st-tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { view = b.dataset.s; draw(); } });
    for (const id of ['st-age', 'st-gender']) $(id).addEventListener('change', draw);
    $('st-q').addEventListener('input', draw);
    return draw;
  }

  function render(D) {
    // A combined team ("Ping/Well M-1") arrives once per club with share 0.5 and half the players.
    const ALL = D.teams.map(([club, town, code, age, gender, comp, division, group, size, kind, share]) =>
      ({ club, town, code, age, gender, comp, division, group, size, kind, share }));
    const nTeams = ts => ts.reduce((s, t) => s + t.share, 0);
    const fmt1 = n => Number.isInteger(n) ? fmt(n) : n.toLocaleString('nl-BE', { maximumFractionDigits: 1 });
    const provinceOf = club => (D.geo[club] || [])[3] || 'Onbekend';

    // Club type: how competitive a club's U10+ youth is, from where those teams play. Points per team
    // (Bart, 2026-10-28): N1 3, N2 2.5, N3 2, R1 1, R2 0.5, R3 0; club score = average over its U10+ teams.
    // Ranked: top 25% highly, next 45% medium, bottom 30% low competitive. Ties: higher national share,
    // then R1 share. Uses all teams, so a club's type ignores the filters.
    const LEVEL_PTS = { 'Nat. 1': 3, 'Nat. 2': 2.5, 'Nat. 3': 2, 'Reg. 1': 1, 'Reg. 2': 0.5, 'Reg. 3': 0 };
    const TYPE_LABEL = { hoog: 'Hoog competitief', middel: 'Middel competitief', laag: 'Laag competitief', geen: 'Geen U10+ competitieteams' };
    const TYPE_SHORT = { hoog: 'Hoog', middel: 'Middel', laag: 'Laag', geen: '–' };
    const TYPE_ORDER = { hoog: 0, middel: 1, laag: 2, geen: 3 };
    const clubType = (() => {
      const by = new Map();
      for (const t of ALL) {
        if (!t.age || t.age < 10 || !(t.division in LEVEL_PTS)) continue;   // recreational R2C has no level
        const b = by.get(t.club) || { n: 0, pts: 0, nat: 0, r1: 0 };
        b.n += t.share;
        b.pts += (LEVEL_PTS[t.division] || 0) * t.share;
        if (/^Nat/.test(t.division)) b.nat += t.share; else if (t.division === 'Reg. 1') b.r1 += t.share;
        by.set(t.club, b);
      }
      const list = [...by].map(([club, b]) => ({ club, ...b, score: b.pts / b.n }))
        .sort((a, b) => b.score - a.score || b.nat / b.n - a.nat / a.n || b.r1 / b.n - a.r1 / a.n);
      // Cut at the 25% and 70% positions, but by score: clubs tied with the last club above a cut stay
      // in that class, so the shares are approximate rather than splitting equal scores.
      const N = list.length, m = new Map();
      const hiScore = N ? list[Math.max(0, Math.round(N * 0.25) - 1)].score : 0, midScore = N ? list[Math.max(0, Math.round(N * 0.70) - 1)].score : 0;
      list.forEach((b, i) => m.set(b.club, { type: b.score >= hiScore - 1e-9 ? 'hoog' : b.score >= midScore - 1e-9 ? 'middel' : 'laag', score: b.score, rank: i + 1, of: N,
        nat: b.nat, r1: b.r1, low: b.n - b.nat - b.r1, n: b.n }));
      return club => m.get(club) || { type: 'geen' };
    })();
    const typeLine = club => {
      const k = clubType(club);
      if (k.type === 'geen') return TYPE_LABEL.geen;
      return TYPE_LABEL[k.type] + ' · #' + k.rank + ' van ' + k.of + ' · score ' + k.score.toLocaleString('nl-BE', { maximumFractionDigits: 2 }) +
        ' · U10+: ' + fmt1(k.nat) + ' nationaal, ' + fmt1(k.r1) + ' R1, ' + fmt1(k.low) + ' R2–R3';
    };
    $('sub').textContent = 'België · outdoor ' + D.season + ' · stand ' + new Date(D.generated).toLocaleDateString('nl-BE');
    const { teams: rankedTeams, GROUPS: rankedGroups } = rankTeams(D.standings);
    const firstTeam = firstTeamMetric(rankedTeams, rankedGroups);
    let strBase = 'first';   // Club Strength: first-team strength against first teams or against all teams
    const firstTeamOf = (club, k) => { const m = firstTeam(club, strBase); return m && m[k[2]]; };   // k: s1M, s1F or s1A

    // ----- Filters: age category, boys/girls, province. Every view is recomputed from the filtered teams. -----
    // Age groups as clubs use them: onderbouw (U7-U9), middenbouw (U10-U12), bovenbouw (U14-U19, R2C U18 included).
    const GROUPS = { onder: ['Onderbouw (U7–U9)', 1, 9], midden: ['Middenbouw (U10–U12)', 10, 12], boven: ['Bovenbouw (U14–U19)', 13, 19] };
    const AGE_SELECT = '<option value="">Alle leeftijden</option><option value="youth">Alle jeugd</option>' +
      '<optgroup label="Groep">' + Object.entries(GROUPS).map(([k, [t]]) => '<option value="g:' + k + '">' + t + '</option>').join('') +
      '<option value="adult">Volwassenen</option></optgroup>' +

      legend.addTo(map);
      drawMap();
    }

    // ----- Doorstroom: how many players a club keeps as its children grow up, per club -----
    // Chart 1: players per stage, onderbouw = 100. Chart 2: players per birth year, U7 = 100
    // (U14 and U16 span 2 birth years, U19 spans 3), ending with all adult players per U7 year.
    const STAGES = [['Onderbouw', a => a >= 1 && a <= 9], ['Middenbouw', a => a >= 10 && a <= 12], ['Bovenbouw', a => a >= 13 && a <= 19], ['Volwassenen', a => !a]];
    const FLOW_AGES = [7, 8, 9, 10, 11, 12, 14, 16, 19], SPAN = { 14: 2, 16: 2, 19: 3 };
    const flowOff = new Set();   // clubs the viewer unticked
    let flowView = false;
    function flowClubs(ts) {
      const by = new Map();
      for (const t of ts) {
        const c = by.get(t.club) || { club: t.club, total: 0, stage: [0, 0, 0, 0], age: {}, adult: 0 };
        c.total += t.size;
        c.stage[STAGES.findIndex(([, f]) => f(t.age))] += t.size;
        if (t.age) c.age[t.age] = (c.age[t.age] || 0) + t.size; else c.adult += t.size;
        by.set(t.club, c);
      }
      return by;
    }
    const series1 = c => c.stage[0] ? c.stage.slice(0, 3).map(v => v / c.stage[0] * 100) : null;   // youth only
    // Chart 2 groups: two birth years each, except U19 (U17-U19, three). Shown per birth year so U19 is comparable.
    const G2 = [['U7–U8', [7, 8], 2], ['U9–U10', [9, 10], 2], ['U11–U12', [11, 12], 2], ['U14', [14], 2], ['U16', [16], 2], ['U19', [19], 3]];
    const series2 = c => {
      const v = G2.map(([, ages, yrs]) => ages.reduce((s, a) => s + (c.age[a] || 0), 0) / yrs);
      return v[0] ? v.map(x => x / v[0] * 100) : null;
    };
    function lineChart(id, labels, clubSeries, avg, ol, dashLast) {
      const W = 900, H = 440, L = 42, R = 170, T = 14, B = 34, svg = $(id);
      // Scale on the youth points only when the last point is the adults total, else it flattens the curve.
      const scaled = v => dashLast ? v.slice(0, -1) : v;
      // Scale to the 90th percentile of the club points (plus average and Olympia) so a few small
      // clubs with extreme ratios don't flatten the bundle; anything above is drawn clipped.
      const clubPts = clubSeries.flatMap(s => scaled(s.vals)).filter(v => isFinite(v)).sort((a, b) => a - b);
      const p90 = clubPts.length ? clubPts[Math.floor(clubPts.length * 0.9)] : 100;
      const keyMax = Math.max(100, p90, ...(avg ? scaled(avg) : []), ...(ol ? scaled(ol.vals) : []));
      const maxV = Math.min(400, Math.max(150, Math.ceil(keyMax * 1.1 / 50) * 50));
      const x = i => L + i * (W - L - R) / (labels.length - 1), y = v => T + (1 - Math.min(v, maxV) / maxV) * (H - T - B);
      const pts = v => v.map((p, i) => x(i) + ',' + y(p)).join(' ');
      const step = maxV <= 200 ? 25 : 50;
      let s = '';
      for (let v = 0; v <= maxV; v += step) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + (v === 100 ? '#5a6272' : '#2a2f3a') + '"' + (v === 100 ? ' stroke-dasharray="4 3"' : '') + '/>' +
        '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#8b93a3">' + v + '</text>';
      labels.forEach((t, i) => s += '<text x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="11" fill="#8b93a3">' + t + '</text>');
      const line = (v, attrs) => {
        if (!dashLast) return '<polyline fill="none" points="' + pts(v) + '" ' + attrs + '/>';
        const n = v.length;   // last segment (to adults) dashed: not a birth-year count
        return '<polyline fill="none" points="' + pts(v.slice(0, n - 1)) + '" ' + attrs + '/>' +
          '<polyline fill="none" stroke-dasharray="5 4" points="' + x(n - 2) + ',' + y(v[n - 2]) + ' ' + x(n - 1) + ',' + y(v[n - 1]) + '" ' + attrs + '/>';
      };

      // End labels: every line gets its name in its own colour, right of the last point. Labels are
      // spread apart (with a thin leader) so 40 names stay readable.
      const ends = clubSeries.map((c, i) => ({ i, name: c.club, col: c.color, v: c.vals[c.vals.length - 1], w: 400 }));
      if (avg) ends.push({ name: 'Gemiddelde', col: '#7adfb0', v: avg[avg.length - 1], w: 700, bold: true });
      if (ol) ends.push({ name: 'Olympia', col: '#ffb86b', v: ol.vals[ol.vals.length - 1], w: 700, bold: true });
      ends.forEach(e => e.y0 = y(e.v));
      ends.sort((a, b) => a.y0 - b.y0);
      const gap = Math.min(11, (H - T - B) / Math.max(ends.length, 1));
      ends.forEach((e, k) => e.ly = Math.max(e.y0, k ? ends[k - 1].ly + gap : T + 4));
      const over = ends.length ? ends[ends.length - 1].ly - (H - B) : 0;   // pushed below the plot: shift the stack up
      if (over > 0) { for (let k = ends.length - 1; k >= 0; k--) { const lim = k === ends.length - 1 ? H - B : ends[k + 1].ly - gap; ends[k].ly = Math.min(ends[k].ly, lim); } }
      const xe = x(labels.length - 1), xl = W - R + 14;
      const label = e => '<line x1="' + (xe + 4) + '" y1="' + e.y0 + '" x2="' + (xl - 3) + '" y2="' + e.ly + '" stroke="' + e.col + '" stroke-opacity=".45" stroke-width=".8"/>' +
        '<text class="lb" x="' + xl + '" y="' + (e.ly + 3.5) + '" font-size="' + (e.bold ? 11.5 : 10) + '" font-weight="' + e.w + '" fill="' + e.col + '">' + esc(e.name) + '</text>';

      });
      const marked = (v, col, name) => line(v, 'stroke="' + col + '" stroke-width="3"') + v.map((p, i) =>
        '<circle cx="' + x(i) + '" cy="' + y(p) + '" r="3.5" fill="' + col + '"><title>' + name + ' · ' + labels[i] + ': ' + Math.round(p) + '</title></circle>' +
        '<text x="' + x(i) + '" y="' + (y(p) - 7) + '" text-anchor="middle" font-size="10" font-weight="600" fill="' + col + '">' + Math.round(p) + '</text>').join('');
      if (avg) s += marked(avg, '#7adfb0', 'Gemiddelde') + label(ends.find(e => e.name === 'Gemiddelde' && e.i === undefined));
      if (ol) s += marked(ol.vals, '#ffb86b', 'Olympia') + label(ends.find(e => e.name === 'Olympia' && e.i === undefined));
      svg.innerHTML = s;
      const hov = $(id + '-hov');
      const clipped = clubSeries.flatMap(s => s.vals).concat(avg || [], ol ? ol.vals : []).some(v => v > maxV);
      const hint = clipped ? 'Waarden boven ' + maxV + ' staan afgekapt bovenaan (het getal toont de echte waarde).' : '';
      hov.textContent = hint;
      const paint = (g, on) => {
        const c = clubSeries[+g.dataset.i];
        for (const p of g.querySelectorAll('polyline:not([stroke=transparent])')) {
          p.setAttribute('stroke', on ? '#3aa3ff' : c.color); p.setAttribute('stroke-opacity', on ? '1' : '.3'); p.setAttribute('stroke-width', on ? '2.5' : '1.2');
        }
        const lb = g.querySelector('text.lb'); lb.setAttribute('font-weight', on ? '700' : '400'); lb.setAttribute('fill', on ? '#3aa3ff' : c.color); lb.setAttribute('fill-opacity', on ? '1' : '.7');
      };
      // Track the one highlighted line. Raising it (appendChild) re-fires mouse events on the moved
      // element, so plain mouseout left lines stuck blue; reset on any change and on leaving the chart.
      let cur = null;
      const reset = () => { if (cur) paint(cur, false); cur = null; hov.textContent = hint; };
      svg.onmouseover = e => {
        const g = e.target.closest('g.cl');
        if (g === cur) return;
        reset();
        if (!g) return;
        const c = clubSeries[+g.dataset.i];
        cur = g; paint(g, true); g.parentNode.appendChild(g);
        hov.textContent = c.club + ': ' + c.vals.map((v, i) => labels[i] + ' ' + Math.round(v)).join(' · ');

    }
    function drawFlow() {
      const g = $('f-gender').value, p = $('f-prov').value;
      const by = flowClubs(ALL.filter(t => (!g || t.gender === g) && (!p || provinceOf(t.club) === p)));
      const top = [...by.values()].sort((a, b) => b.total - a.total).slice(0, 40);
      // Olympia always shown, whatever the province filter; the gender filter still applies.
      const olC = flowClubs(ALL.filter(t => t.club === 'Olympia' && (!g || t.gender === g))).get('Olympia');
      $('fsel-list').innerHTML = top.map((c, i) => '<label title="' + esc(c.club + ' · ' + TYPE_LABEL[clubType(c.club).type]) + '"><input type="checkbox" data-c="' + esc(c.club) + '"' + (flowOff.has(c.club) ? '' : ' checked') + '> ' +
        (i + 1) + '. ' + esc(c.club) + ' <span class="ty ty-' + clubType(c.club).type + '">' + TYPE_SHORT[clubType(c.club).type] + '</span></label>').join('');
      // One toggle per club type: ticked = all its clubs in, unticked = all out, dash = some.
      flowTop = top;
      $('fsel-types').innerHTML = ['hoog', 'middel', 'laag', 'geen'].filter(k => top.some(c => clubType(c.club).type === k)).map(k => {
        const of = top.filter(c => clubType(c.club).type === k), on = of.filter(c => !flowOff.has(c.club)).length;
        return '<label><input type="checkbox" data-t="' + k + '"' + (on === of.length ? ' checked' : '') + (on && on < of.length ? ' data-mixed="1"' : '') + '> ' +
          '<span class="ty ty-' + k + '">' + TYPE_SHORT[k] + '</span> ' + on + '/' + of.length + '</label>';

      const color = () => '#9aa1ad';   // club lines stay light grey; average and Olympia carry the colour
      const s1 = sel.map(c => ({ club: c.club, color: color(c), vals: series1(c) })).filter(c => c.vals);
      const s2 = sel.map(c => ({ club: c.club, color: color(c), vals: series2(c) })).filter(c => c.vals);
      // Average = the shown clubs pooled (all their players at a stage / all at the base), so a club
      // with five U7 players cannot swing it the way a plain mean of ratios would. Clubs without U7, U8 or U9
      // stay out: a missing step would look like growth or loss between two groups.

        'Gemiddelde = de getoonde clubs samengeteld (alle spelers per stap ÷ alle spelers in de basis), zodat een kleine club met weinig U7 het niet scheeftrekt. Olympia staat er altijd apart bij. ' +
        (outPool.length ? 'Niet in het gemiddelde, want geen U7, U8 of U9: ' + outPool.join(', ') + '. ' : '') +
        'Grafiek 1 telt spelers per bouw: bovenbouw beslaat 7 geboortejaren (U13–U19), onder- en middenbouw elk 3, dus een vlakke lijn betekent al uitval per jaar. ' +
        'Grafiek 2 telt per groep van twee geboortejaren (U19 = drie: U17–U19) en deelt door het aantal jaren, zodat U19 vergelijkbaar blijft. Volwassenen staan voorlopig niet in de grafieken. ' +
        (dropped1 ? dropped1 + ' club(s) zonder onderbouw niet in grafiek 1. ' : '') + (dropped2 ? dropped2 + ' club(s) zonder U7–U8 niet in grafiek 2.' : '');
      drawProjection(olC, inPool.length ? pool : null, sel, inPool.length);
    }

    // ----- Projection: Olympia's youth over the next 5 seasons, with the selection's doorstroom -----
    // Single birth years 7..19. A category spanning more years (U14 = 13-14, U16 = 15-16, U19 = 17-19)
    // is spread evenly over its years. Each season a birth year moves up one age and is multiplied by
    // the selection's ratio for that step; U7 gets the same number of starters as now.
    const CAT_OF = { 7: 7, 8: 8, 9: 9, 10: 10, 11: 11, 12: 12, 13: 14, 14: 14, 15: 16, 16: 16, 17: 19, 18: 19, 19: 19 };
    const perYear = c => { const o = {}; for (let a = 7; a <= 19; a++) { const k = CAT_OF[a]; o[a] = (c.age[k] || 0) / (SPAN[k] || 1); } return o; };
    let projSrc = 'avg';   // whose ratios drive the projection: the selection's average or one club
    function drawProjection(olC, pool, sel, poolClubs) {
      if (!olC || !pool) { $('proj').innerHTML = '<p class="note">Geen projectie: kies minstens één club en een selectie waarin Olympia teams heeft.</p>'; return; }
      const src = projSrc !== 'avg' && sel.find(c => c.club === projSrc);
      if (!src) projSrc = 'avg';
      const p = perYear(src || pool), r = {};
      for (let a = 7; a < 19; a++) r[a] = p[a] ? p[a + 1] / p[a] : 0;
      const years = [perYear(olC)];
      for (let t = 1; t <= 5; t++) {
        const prev = years[t - 1], n = { 7: years[0][7] };
        for (let a = 8; a <= 19; a++) n[a] = prev[a - 1] * r[a - 1];
        years.push(n);
      }

      const cats = G2.map(([name, ks]) => [name, Object.keys(CAT_OF).filter(a => ks.includes(CAT_OF[a])).map(Number)]);
      const catVal = (n, ages) => ages.reduce((s, a) => s + n[a], 0);
      const grp = (n, lo, hi) => { let s = 0; for (let a = lo; a <= hi; a++) s += n[a]; return s; };
      // Non-competition groups use the same ratios as the club table, on each year's projected base, so
      // "Nu" is Olympia's real 88 and 29. No gender split, so they drop out under a gender filter.
      const nc = !$('f-gender').value;
      const preU7 = n => nc ? PRE_RATIO * grp(n, 7, 8) : 0, s2hOf = n => nc ? S2H_RATIO * grp(n, 9, 14) : 0;
      const total0 = grp(years[0], 7, 19) + preU7(years[0]) + s2hOf(years[0]);
      const head = '<tr><th class="l"></th><th class="ncc" title="Non-competitie: zelfde ratio als cluboverzicht, op spelers U7–U8">Pre U7</th><th class="ncc" title="Non-competitie: zelfde ratio als cluboverzicht, op spelers U9–U14">S2H</th>' + cats.map(([k], i) => '<th' + (i ? '' : ' class="gs"') + '>' + k + '</th>').join('') +
        '<th class="gs">Onderbouw</th><th>Middenbouw</th><th>Bovenbouw</th><th>Jeugd in teams</th><th>Totaal incl. non-comp.</th><th>t.o.v. nu</th></tr>';
      const body = years.map((n, t) => {
        const teamsTot = grp(n, 7, 19), tot = teamsTot + preU7(n) + s2hOf(n), d = tot - total0;
        return '<tr' + (t ? '' : ' class="now"') + '><td class="l">' + (t ? '+' + t + ' jaar' : 'Nu') + '</td><td class="ncc">' + (nc ? fmt(Math.round(preU7(n))) : '–') + '</td><td class="ncc">' + (nc ? fmt(Math.round(s2hOf(n))) : '–') + '</td>' +
          cats.map(([, ages], i) => '<td' + (i ? '' : ' class="gs"') + '>' + fmt(Math.round(catVal(n, ages))) + '</td>').join('') +
          '<td class="gs">' + fmt(Math.round(grp(n, 7, 9))) + '</td><td>' + fmt(Math.round(grp(n, 10, 12))) + '</td><td>' + fmt(Math.round(grp(n, 13, 19))) + '</td>' +
          '<td>' + fmt(Math.round(teamsTot)) + '</td><td class="total">' + fmt(Math.round(tot)) + '</td><td>' + (t ? (d >= 0 ? '+' : '−') + fmt(Math.abs(Math.round(d))) + ' (' + (d >= 0 ? '+' : '−') + Math.abs(Math.round(d / total0 * 100)) + '%)' : '') + '</td></tr>';
      }).join('');

        'Binnen U14, U16 en U19 blijft een jaargang gelijk (de telling per categorie zegt niet hoe het tussen die jaren verloopt). ' +

    // ----- Leden Olympia: the bond-based estimate against the club's own member list -----
    let ledenView = false;

      const g = $('f-gender').value;
      const ours = ALL.filter(t => t.club === 'Olympia' && (!g || t.gender === g));

        cur.setAttribute('r', 8);
        tip.hidden = false;
        tip.textContent = '';
        const name = document.createElement('b'); name.textContent = p.club; tip.appendChild(name);
        tip.appendChild(document.createTextNode(' · ' + fmt(Math.round(p.total)) + (all ? ' leden' : ' jeugdleden') + ' op ' + p.x + (p.x === 1 ? ' veld' : ' velden') + ' · ' + fmt(Math.round(p.y)) + ' per veld'));
        tip.style.left = Math.max(0, Math.min(dotX(p) + 12, W - tip.offsetWidth)) + 'px';
        tip.style.top = Math.max(0, py(p.y) - 34) + 'px';
      };
      el.onpointerleave = reset;
    }
    $('ov-tabs').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      ovSub = b.dataset.s;
      for (const x of $('ov-tabs').querySelectorAll('button')) x.classList.toggle('active', x === b);
      $('ov-table').hidden = ovSub !== 'table'; $('ov-fields').hidden = ovSub !== 'fields'; $('ov-fees').hidden = ovSub !== 'fees'; $('fc-mode').hidden = ovSub !== 'fields';
      $('f-age').disabled = $('f-gender').disabled = ovSub === 'fees';   // fees hold for the whole club
      if (ovSub === 'fields') drawFieldChart();
      if (ovSub === 'fees') drawFees();
    });
    $('fc-mode').addEventListener('change', drawFieldChart);

    // ----- Club Overview, Fees: published membership fees in six categories; province and search apply. -----
    const FEE_CATS = [['pre', 'Mini (U6 en jonger)'], ['jong', 'Jeugd U7–U12'], ['boven', 'Jeugd U14–U19'], ['senior', 'Senioren competitie'], ['gl', 'Gents en Ladies'], ['trim', 'Trimmers']];
    const FEE_COLS = [['club', 'Club', 'l'], ['pre', 'Mini'], ['jong', 'U7–U12'], ['boven', 'U14–U19'], ['senior', 'Senioren'], ['gl', 'Gents/Ladies'], ['trim', 'Trimmers'], ['top', 'Topjeugd'], ['season', 'Seizoen', 'l'], ['source', 'Bron', 'l']];
    let feeKey = 'boven', feeDir = -1;
    const feeNum = v => v === null || v === undefined ? '–' : fmt(Math.round(v));
    function drawFees() {
      const prov = $('f-prov').value, q = $('q').value.trim().toLowerCase();
      const list = D.fees.filter(c => !prov || provinceOf(c.club) === prov);
      const bench = list.filter(c => !c.out), ol = D.fees.find(c => c.club === 'Olympia');
      const at = (s, p) => s[Math.round((s.length - 1) * p)];
      const median = s => s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2;
      $('fee-cats').innerHTML = '<thead><tr><th class="l">Categorie</th><th>Clubs</th><th>Laag (P25)</th><th>Typisch (mediaan)</th><th>Hoog (P75)</th><th>Laagste</th><th>Hoogste</th><th>Olympia</th><th>Clubs onder Olympia</th></tr></thead><tbody>' +
        FEE_CATS.map(([k, name]) => {
          const s = bench.map(c => c[k]).filter(v => v !== null).sort((a, b) => a - b);
          if (!s.length) return '<tr><td class="l">' + name + '</td><td>0</td><td colspan="7"></td></tr>';
          return '<tr><td class="l">' + name + '</td><td>' + s.length + '</td><td>' + feeNum(at(s, .25)) + '</td><td class="total">' + feeNum(median(s)) + '</td><td>' + feeNum(at(s, .75)) + '</td><td>' + feeNum(s[0]) + '</td><td>' + feeNum(s[s.length - 1]) + '</td>' +
            '<td>' + feeNum(ol[k]) + '</td><td>' + Math.round(s.filter(v => v < ol[k]).length / s.length * 100) + '%</td></tr>';
        }).join('') + '</tbody>';
      const rowsF = list.filter(c => !q || c.club.toLowerCase().includes(q)).sort((a, b) => {
        const x = a[feeKey], y = b[feeKey];
        if (x === null || x === undefined) return 1;
        if (y === null || y === undefined) return -1;
        return (typeof x === 'string' ? x.localeCompare(y) : x - y) * feeDir; });
      $('fee-clubs').tHead.innerHTML = '<tr>' + FEE_COLS.map(([k, t, cl]) => '<th data-k="' + k + '" class="' + (cl || '') + '">' + t + (k === feeKey ? (feeDir < 0 ? ' ▼' : ' ▲') : '') + '</th>').join('') + '</tr>';
      $('fee-clubs').tBodies[0].innerHTML = rowsF.map(c => '<tr' + (c.club === 'Olympia' ? ' class="st-ours"' : '') + '>' + FEE_COLS.map(([k, , cl]) => {
        if (k === 'club') return '<td class="l">' + esc(c.club) + (c.out ? ' *' : '') + '</td>';
        if (k === 'season') return '<td class="l">' + esc(c.season || '?') + '</td>';
        if (k === 'source') return '<td class="l">' + (c.source ? '<a href="' + esc(c.source) + '" target="_blank" rel="noopener" style="color:var(--accent)">link</a>' : '–') + '</td>';
        return '<td>' + feeNum(c[k]) + '</td>'; }).join('') + '</tr>').join('');
      $('fee-note').textContent = D.fees.length + ' van 111 clubs publiceren hun lidgeld. Bedrag = gewoon competitielid, aan het vroegboektarief als de club twee tarieven heeft. Verplichte jaarlijkse bijdragen zijn opgeteld (Antwerp 140, Dragons 90, Oree 135). ' +
        'Niet inbegrepen: eenmalige instapgelden, waarborgen, barkrediet, indoor, enkel-trainingsleden, G-hockey, studenten en niet-spelende leden. Jeugdbedragen zijn het gemiddelde over de leeftijden. Topjeugd = apart tarief voor eerste of performance-teams. ' +
        'Niet alles is vergelijkbaar: veel clubs rekenen de bondsbijdrage mee, andere vermelden dat niet, dus verschillen onder 25 euro zeggen weinig. Sommige clubs tonen nog een ouder seizoen. * = niet in de vergelijking: Nederlandse clubs en Leopold, waar het hockeybedrag bovenop een aparte omnisportbijdrage komt.';
    }
    $('fee-clubs').addEventListener('click', e => {
      const th = e.target.closest('th[data-k]');
      if (!th || th.dataset.k === 'source') return;
      const k = th.dataset.k;
      feeDir = k === feeKey ? -feeDir : (['club', 'season'].includes(k) ? 1 : -1);
      feeKey = k;
      drawFees();
    });
    window.addEventListener('resize', () => { if (!$('v-table').hidden && ovSub === 'fields') drawFieldChart(); });

    let drawSterkte = null;
    function showView(v) {
      $('v-table').hidden = v !== 'table'; $('v-map').hidden = v !== 'map'; $('v-flow').hidden = v !== 'flow'; $('v-leden').hidden = v !== 'leden'; $('q').hidden = v !== 'table' && v !== 'clubstr';
      $('v-sterkte').hidden = v !== 'sterkte'; $('v-clubstr').hidden = v !== 'clubstr';
      $('filterbar').hidden = v === 'sterkte' || (v === 'clubstr' && strSub === 'evo');   // Team Strength has its own age and gender selectors
      strView = v === 'clubstr';
      if (strView) drawStrength();
      $('f-gender').disabled = v === 'clubstr' && strSub === 'table';
      $('f-age').disabled = v === 'flow' || v === 'leden' || v === 'clubstr';   // the curves and the member check span all ages by design
      $('f-prov').disabled = v === 'leden';                  // Olympia only
      for (const b of $('tabs').querySelectorAll('button')) b.classList.toggle('active', b.dataset.v === v);
      flowView = v === 'flow'; ledenView = v === 'leden';
      if (v === 'leden') drawLeden();
      if (v === 'map') { if (!map) initMap(); else map.invalidateSize(); }
      if (v === 'flow') drawFlow();
      if (v === 'table' && ovSub === 'fields') drawFieldChart();
      if (v === 'table' && ovSub === 'fees') { drawFees(); $('f-age').disabled = $('f-gender').disabled = true; }
      if (v === 'sterkte') { if (!drawSterkte) drawSterkte = strengthView(D.standings, rankedTeams, rankedGroups, clubCompare(rankedTeams, firstTeam), D.evolution); drawSterkte(); }
    }
    $('tabs').hidden = false;
    $('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showView(b.dataset.v); });

    $('q').hidden = false;
    function draw() {
      COLS = cols();
      if (!COLS.some(([k]) => k === sortKey)) { sortKey = 'players'; sortDir = -1; }
      const q = $('q').value.trim().toLowerCase();
      // Rank over all filtered clubs in the current sort order (search does not change it); ties share a rank.
      const sorted = rows.slice().sort((a, b) => { const x = sortVal(a, sortKey), y = sortVal(b, sortKey);
        return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sortDir; });
      sorted.forEach((c, i) => {
        const prev = sorted[i - 1], v = sortVal(c, sortKey);
        c.rank = i && typeof v === 'number' && Math.abs(sortVal(prev, sortKey) - v) < 1e-9 ? prev.rank : i + 1;
      });
      const list = sorted.filter(c => !q || c.club.toLowerCase().includes(q) || (c.town || '').toLowerCase().includes(q));
      // Two header rows: column groups (club, competitieniveau, aantal teams, spelers) over the columns,
      // each group tinted and opened by a vertical line.
      const gcls = (k, i) => 'grp-' + colGroup(k) + (i && colGroup(COLS[i - 1][0]) !== colGroup(k) ? ' gstart' : '');
      const spans = [];
      COLS.forEach(([k]) => { const g = colGroup(k); if (spans.length && spans[spans.length - 1].g === g) spans[spans.length - 1].n++; else spans.push({ g, n: 1, k }); });
      $('clubs').tHead.innerHTML = '<tr class="ghead">' + spans.map((s, i) => '<th colspan="' + s.n + '" class="grp-' + s.g + (i ? ' gstart' : '') + '">' + GROUP_LABEL[s.g] + '</th>').join('') + '</tr>' +
        '<tr>' + COLS.map(([k, t, cl, title], i) => '<th data-k="' + k + '" class="' + (cl || '') + ' ' + gcls(k, i) + '"' + (title ? ' title="' + title + '"' : '') + '>' + t +
        (k === sortKey ? (sortDir < 0 ? ' ▼' : ' ▲') : '') + '</th>').join('') + '</tr>';
      $('clubs').tBodies[0].innerHTML = list.map(c => '<tr class="club" data-c="' + esc(c.club) + '">' +
        COLS.map(([k, , cl], i) => '<td class="' + (cl || '') + (k === 'players' ? ' total' : '') + ' ' + gcls(k, i) + '">' + cell(c, k) + '</td>').join('') + '</tr>').join('');
    }
    $('clubs').addEventListener('click', e => {
      if (e.target.closest('tr.detail')) return;
      const th = e.target.closest('th');
      if (th) { const k = th.dataset.k; if (!k || k === 'rank') return; sortDir = k === sortKey ? -sortDir : (['club', 'town', 'prov', 'type'].includes(k) ? 1 : -1); sortKey = k; draw(); return; }
      const tr = e.target.closest('tr.club');
      if (!tr) return;
      if (tr.nextElementSibling && tr.nextElementSibling.classList.contains('detail')) { tr.nextElementSibling.remove(); return; }
      tr.insertAdjacentHTML('afterend', '<tr class="detail"><td colspan="' + COLS.length + '"><div class="typeline">' + esc(typeLine(tr.dataset.c)) + '</div>' +
        clubDetail(clubs.get(tr.dataset.c), fmt1) + '</td></tr>');
    });
    const fieldsShown = () => !$('v-table').hidden && ovSub === 'fields', feesShown = () => !$('v-table').hidden && ovSub === 'fees';
    $('q').addEventListener('input', () => { draw(); if (strView) drawStrength(); if (fieldsShown()) drawFieldChart(); if (feesShown()) drawFees(); });

    function apply() { compute(); drawSummary(); draw(); if (map) drawMap(); if (flowView) drawFlow(); if (ledenView) drawLeden(); if (strView) drawStrength(); if (fieldsShown()) drawFieldChart(); if (feesShown()) drawFees(); }
    for (const id of ['f-age', 'f-gender', 'f-prov']) $(id).addEventListener('change', apply);
    apply();
  }
})();
</script>
</body>
</html>
