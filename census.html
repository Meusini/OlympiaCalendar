<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Clubs en teams</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --text:#e6e8ec; --muted:#8b93a3; --accent:#3aa3ff; --accent2:#7adfb0; --bad:#ff7a90; --hl:rgba(58,163,255,.16);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:14px 20px;
    background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header h1 .sub { color:var(--muted); font-weight:400; margin-left:8px; font-size:13px; }
  header .grow { flex:1; }
  input, button, select { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 11px; font:inherit; min-width:0; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  main { padding:18px 20px 60px; max-width:1300px; }
  .lock { max-width:360px; margin:12vh auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; }
  .lock h2 { margin:0 0 12px; font-size:16px; }
  .lock form { display:flex; gap:8px; } .lock input { flex:1; }
  .lock .err { color:var(--bad); font-size:13px; margin-top:10px; min-height:18px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-bottom:18px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .kpi .v { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi .l { color:var(--muted); font-size:12px; }
  h2.sec { font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; margin:26px 0 10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:6px 8px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:12px; position:sticky; top:0; background:var(--panel); cursor:pointer; user-select:none; }
  th.l, td.l { text-align:left; }
  tbody tr:hover td { background:var(--hl); }
  tr.club { cursor:pointer; }
  tr.detail td { background:var(--panel2); text-align:left; white-space:normal; }
  .mxwrap { display:flex; flex-wrap:wrap; gap:14px 28px; padding:6px 0 4px; }
  .mxh { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; margin-bottom:4px; }
  table.mx { width:auto; }
  table.mx th, table.mx td { text-align:center; padding:3px 9px; background:transparent; }
  table.mx th { position:static; cursor:default; }
  table.mx th.l, table.mx td.l { text-align:left; }
  table.mx tbody tr:hover td { background:var(--hl); }
  td.total { font-weight:600; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  @media (max-width: 600px) { header, main { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<header>
  <a href="index.html" style="text-decoration:none;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)">◀ Velden</a>
  <h1>Clubs en teams <span class="sub" id="sub">België · outdoor</span></h1>
  <div class="grow"></div>
  <input id="q" type="search" placeholder="Zoek club…" hidden />
</header>
<main id="main">
  <div class="lock">
    <h2>Beveiligde pagina</h2>
    <form id="unlock"><input id="pw" type="password" placeholder="Wachtwoord" autocomplete="current-password" autofocus /><button>Open</button></form>
    <div class="err" id="err"></div>
  </div>
</main>

<script>
(function () {
  const BOX = JSON.parse(document.getElementById('census-box').textContent);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const fmt = n => n.toLocaleString('nl-BE');

  async function decrypt(pw) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(BOX.salt), iterations: BOX.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(BOX.iv) }, key, unb64(BOX.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  $('unlock').addEventListener('submit', async e => {
    e.preventDefault();
    $('err').textContent = 'Bezig…';
    try { render(await decrypt($('pw').value)); }
    catch (err) { $('err').textContent = 'Fout wachtwoord.'; }
  });

  // Age bands follow the match formats: 3v3, 6v6, 8v8, 11v11.
  const BANDS = [['U7–U8', a => a >= 7 && a <= 8], ['U9', a => a === 9], ['U10–U12', a => a >= 10 && a <= 12],
                 ['U14–U19', a => a >= 13], ['Volw.', a => !a]];
  const level = t => /Top Hockey/.test(t.comp) ? 'Top' : /^Nat/.test(t.division) ? 'Nationaal' : /^Reg/.test(t.division) ? 'Regionaal' : 'Overig';

  // Club detail: team counts per sub-level. An adult level only means something inside one
  // competition (Reg. 2 Open League is not Reg. 2 Fun League), so adults get a row per
  // competition; youth get a row per age and gender.
  const SUB = [['Top', 'Top'], ['Nat. Honour', 'Hon.'], ['Nat. 1', 'N1'], ['Nat. 2', 'N2'], ['Nat. 3', 'N3'], ['Nat. 4', 'N4'],
               ['Reg. 1', 'R1'], ['Reg. 2', 'R2'], ['Reg. 3', 'R3'], ['Reg. 4', 'R4'], ['Overig', 'Overig']];
  const subOf = t => /Top Hockey/.test(t.comp) ? 'Top' : SUB.some(([k]) => k === t.division) ? t.division : 'Overig';
  const COMP_ORDER = ['Top Hockey', 'Belgian League', 'Open League Men', 'Open League Women', 'Fun League Men', 'Fun League Women',
                      'Open League Gentlemen', 'Fun League Gentlemen', 'Ladies', 'Junior Ladies', '45+', '35+', 'Trimmers', 'R2C'];
  const compOrder = comp => { const i = COMP_ORDER.findIndex(k => comp.startsWith(k)); return i < 0 ? 99 : i; };
  const YOUTH_G = { M: 'jongens', F: 'meisjes', '': 'gemengd' };

  function matrix(title, rows, fmt1) {
    if (!rows.length) return '';
    const sum = (ts, f) => ts.reduce((s, t) => s + f(t), 0);
    const used = SUB.filter(([k]) => rows.some(r => r.teams.some(t => subOf(t) === k)));
    const cell = (ts, k) => { const n = sum(ts.filter(t => subOf(t) === k), t => t.share); return n ? fmt1(n) : ''; };
    return '<div><div class="mxh">' + title + '</div><table class="mx"><thead><tr><th class="l"></th>' +
      used.map(([k, s]) => '<th title="' + k + '">' + s + '</th>').join('') + '<th>Teams</th><th>Spelers</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td class="l">' + esc(r.label) + '</td>' + used.map(([k]) => '<td>' + cell(r.teams, k) + '</td>').join('') +
        '<td class="total">' + fmt1(sum(r.teams, t => t.share)) + '</td><td>' + fmt1(Math.round(sum(r.teams, t => t.size))) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }

  function clubDetail(c, fmt1) {
    const youth = c.teams.filter(t => t.age), adult = c.teams.filter(t => !t.age);
    const yRows = [], aRows = [];
    for (const age of [...new Set(youth.map(t => t.age))].sort((a, b) => a - b))
      for (const g of ['M', 'F', '']) {
        const ts = youth.filter(t => t.age === age && (t.gender || '') === g);
        if (ts.length) yRows.push({ label: 'U' + age + ' ' + YOUTH_G[g], teams: ts });
      }
    const byComp = new Map();
    for (const t of adult) { if (!byComp.has(t.comp)) byComp.set(t.comp, []); byComp.get(t.comp).push(t); }
    for (const [comp, ts] of [...byComp].sort((a, b) => compOrder(a[0]) - compOrder(b[0]) || a[0].localeCompare(b[0])))
      aRows.push({ label: comp, teams: ts });
    return '<div class="mxwrap">' + matrix('Jeugd', yRows, fmt1) + matrix('Volwassenen', aRows, fmt1) + '</div>';
  }

  function render(D) {
    // A combined team ("Ping/Well M-1") arrives once per club with share 0.5 and half the players.
    const teams = D.teams.map(([club, town, code, age, gender, comp, division, group, size, kind, share]) =>
      ({ club, town, code, age, gender, comp, division, group, size, kind, share }));
    const nTeams = ts => ts.reduce((s, t) => s + t.share, 0);
    const fmt1 = n => Number.isInteger(n) ? fmt(n) : n.toLocaleString('nl-BE', { maximumFractionDigits: 1 });
    $('sub').textContent = 'België · outdoor ' + D.season + ' · stand ' + new Date(D.generated).toLocaleDateString('nl-BE');

    const clubs = new Map();
    for (const t of teams) {
      const c = clubs.get(t.club) || { club: t.club, town: t.town, teams: [], bands: BANDS.map(() => 0), players: 0, youthP: 0, adultP: 0 };
      c.teams.push(t);
      c.bands[BANDS.findIndex(([, f]) => f(t.age))] += t.share;
      c.players += t.size;
      if (t.age) c.youthP += t.size; else c.adultP += t.size;
      clubs.set(t.club, c);
    }
    const rows = [...clubs.values()];
    const sum = f => rows.reduce((s, c) => s + f(c), 0);
    const allTeams = nTeams(teams), youthTeams = nTeams(teams.filter(t => t.age));

    // Overview: age band x level
    const LEVELS = ['Top', 'Nationaal', 'Regionaal', 'Overig'];
    const grid = BANDS.map(([name, f]) => {
      const ts = teams.filter(t => f(t.age));
      return { name, cells: LEVELS.map(l => nTeams(ts.filter(t => level(t) === l))), n: nTeams(ts),
               p: ts.reduce((s, t) => s + t.size, 0), m: nTeams(ts.filter(t => t.gender === 'M')), f: nTeams(ts.filter(t => t.gender === 'F')) };
    });

    let sortKey = 'players', sortDir = -1;
    const COLS = [['club', 'Club', 'l'], ['town', 'Gemeente', 'l'], ['n', 'Teams'],
      ...BANDS.map(([b], i) => ['b' + i, b]), ['youthP', 'Spelers jeugd'], ['adultP', 'Spelers volw.'], ['players', 'Spelers totaal']];
    const val = (c, k) => k === 'n' ? nTeams(c.teams) : k[0] === 'b' && k.length === 2 ? c.bands[+k[1]] : c[k];
    const show = v => typeof v === 'number' ? (v ? fmt1(v) : '') : v;

    $('main').innerHTML = '<div class="kpis">' +
      [[fmt(clubs.size), 'clubs met teams'], [fmt1(allTeams), 'teams'], [fmt1(youthTeams), 'jeugdteams'],
       [fmt1(allTeams - youthTeams), 'volwassenenteams'], [fmt(sum(c => c.players)), 'spelers (schatting)'],
       [fmt(sum(c => c.youthP)), 'waarvan jeugd']].map(([v, l]) => '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>').join('') +
      '</div>' +
      '<h2 class="sec">Teams per leeftijd en niveau</h2><div class="card"><table><thead><tr><th class="l">Categorie</th>' +
      LEVELS.map(l => '<th>' + l + '</th>').join('') + '<th>Teams</th><th>Jongens/heren</th><th>Meisjes/dames</th><th>Spelers</th></tr></thead><tbody>' +
      grid.map(g => '<tr><td class="l">' + g.name + '</td>' + g.cells.map(x => '<td>' + show(x) + '</td>').join('') +
        '<td class="total">' + show(g.n) + '</td><td>' + show(g.m) + '</td><td>' + show(g.f) + '</td><td class="total">' + fmt(g.p) + '</td></tr>').join('') +
      '</tbody></table></div>' +
      '<h2 class="sec">Per club</h2><div class="card"><table id="clubs"><thead></thead><tbody></tbody></table></div>' +
      '<div class="note">Spelers = teams × kerngrootte per spelvorm: U7–U8 (3v3) 5 · U9 (6v6) 10 · U10–U12 (8v8) 11 · U14+ en volwassenen (11v11) 16. ' +
      'Telt enkel outdoor competitieteams; spelers zonder team (U6, coaches, niet-spelende leden) ontbreken en spelers in twee teams tellen dubbel. ' +
      'Een samenwerkingsteam (bv. Ping/Well) telt voor elke club als een half team. ' +
      'Ter vergelijking: Hockey Belgium telt iets meer dan 63.000 aangesloten leden in 111–113 clubs (2026, BX1 / DH); deze schatting dekt dus ca. 70% van de leden. ' +
      'Klik een club voor de teamlijst.</div>';

    $('q').hidden = false;
    function draw() {
      const q = $('q').value.trim().toLowerCase();
      const list = rows.filter(c => !q || c.club.toLowerCase().includes(q) || (c.town || '').toLowerCase().includes(q))
        .sort((a, b) => { const x = val(a, sortKey), y = val(b, sortKey);
          return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sortDir; });
      $('clubs').tHead.innerHTML = '<tr>' + COLS.map(([k, t, cl]) => '<th data-k="' + k + '" class="' + (cl || '') + '">' + t +
        (k === sortKey ? (sortDir < 0 ? ' ▼' : ' ▲') : '') + '</th>').join('') + '</tr>';
      $('clubs').tBodies[0].innerHTML = list.map(c => '<tr class="club" data-c="' + esc(c.club) + '">' +
        COLS.map(([k, , cl]) => '<td class="' + (cl || '') + (k === 'players' ? ' total' : '') + '">' + esc(show(val(c, k))) + '</td>').join('') + '</tr>').join('');
    }
    $('clubs').addEventListener('click', e => {
      if (e.target.closest('tr.detail')) return;
      const th = e.target.closest('th');
      if (th) { const k = th.dataset.k; sortDir = k === sortKey ? -sortDir : (k === 'club' || k === 'town' ? 1 : -1); sortKey = k; draw(); return; }
      const tr = e.target.closest('tr.club');
      if (!tr) return;
      if (tr.nextElementSibling && tr.nextElementSibling.classList.contains('detail')) { tr.nextElementSibling.remove(); return; }
      tr.insertAdjacentHTML('afterend', '<tr class="detail"><td colspan="' + COLS.length + '">' + clubDetail(clubs.get(tr.dataset.c), fmt1) + '</td></tr>');
    });
    $('q').addEventListener('input', draw);
    draw();
  }
})();
</script>
</body>
</html>
